openapi: 3.1.0
info:
  title: Studia API
  version: 0.1.0
  description: >
    Contrato MVP para Mock Server e futuro Spring Boot.
    Access token via Authorization Bearer (memória no client).
    Refresh token via cookie HttpOnly (credentials include).
servers:
  - url: /api/v1
    description: Base path MVP
tags:
  - name: auth
  - name: studies
  - name: billing
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: Refresh token HttpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and start a session (FEATURE-0004)
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and authenticated
          headers:
            Set-Cookie:
              description: Refresh token HttpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request a password reset link
      description: >
        Always answers 202, whether or not the email has an account (no account enumeration).
        The reset token is single-use and expires in 1 hour.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted
        '422':
          $ref: '#/components/responses/Problem'
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: A successful reset revokes every session and every pending reset token of the user.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh cookie and issue new access token
      operationId: refresh
      responses:
        '200':
          description: Session renewed
          headers:
            Set-Cookie:
              description: Rotated refresh token HttpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Problem'
  /auth/me:
    get:
      tags: [auth]
      summary: Current user, plan, entitlements and usage
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /studies:
    get:
      tags: [studies]
      summary: List studies for the current user
      operationId: listStudies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Study list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [studies]
      summary: Create a study (wizard submit)
      operationId: createStudy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyRequest'
      responses:
        '201':
          description: Study created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /studies/{studyId}:
    get:
      tags: [studies]
      summary: Get study by id
      operationId: getStudy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: Study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [studies]
      summary: Update study fields (localized edit)
      operationId: updateStudy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudyRequest'
      responses:
        '200':
          description: Study updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /billing/subscription:
    get:
      tags: [billing]
      summary: Current Premium subscription (FEATURE-0006)
      operationId: getSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Problem'
  /billing/checkout:
    post:
      tags: [billing]
      summary: Start a Mercado Pago hosted checkout (ADR-0012)
      description: >
        CARD starts a monthly recurring subscription; PIX buys 30 days of Premium (and may renew an active
        Pix period). The plan only changes when the gateway webhook confirms the payment.
        A new checkout invalidates any open one. Returns 409 BILLING_ALREADY_PREMIUM while Premium,
        except a PIX checkout on an active Pix period (renewal).
      operationId: createCheckout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method]
              properties:
                method:
                  $ref: '#/components/schemas/BillingMethod'
      responses:
        '201':
          description: Checkout created; the client redirects to checkoutUrl
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl]
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /billing/subscription/cancel:
    post:
      tags: [billing]
      summary: Cancel the card subscription at the end of the paid period
      operationId: cancelSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription canceled; Premium stays until currentPeriodEnd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    studyId:
      name: studyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        timeZone:
          type: string
          description: IANA time zone from the browser (ADR-0009). Invalid or missing → UTC.
          example: America/Sao_Paulo
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthSessionResponse:
      type: object
      required: [accessToken, user, plan, entitlements, usage]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
        plan:
          $ref: '#/components/schemas/Plan'
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        usage:
          $ref: '#/components/schemas/Usage'
    MeResponse:
      type: object
      required: [user, plan, entitlements, usage]
      properties:
        user:
          $ref: '#/components/schemas/User'
        plan:
          $ref: '#/components/schemas/Plan'
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        usage:
          $ref: '#/components/schemas/Usage'
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timeZone:
          type: string
          description: IANA zone used for the quota period (ADR-0009)
          example: America/Sao_Paulo
    Plan:
      type: string
      enum: [FREE, PREMIUM]
      description: Informative for billing UI only — never authorize with plan checks
    Entitlements:
      type: object
      required: [capabilities, limits]
      properties:
        capabilities:
          type: array
          items:
            type: string
          example: [studies.create, studies.unlimited]
        limits:
          type: object
          additionalProperties:
            type: integer
          example:
            maxActiveStudies: 3
            maxStudyCreationsPerMonth: 10
    Usage:
      type: object
      required: [studyCreationsThisPeriod]
      properties:
        studyCreationsThisPeriod:
          type: object
          required: [used, limit, remaining, periodStart, periodEnd]
          description: >
            Free: calendar month in the user's time zone (ADR-0009).
            The client only displays the period; it never computes it.
          properties:
            used:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 0
            remaining:
              type: integer
              minimum: 0
            periodStart:
              type: string
              format: date-time
              description: Instant the current period started (UTC)
              example: '2026-10-01T03:00:00Z'
            periodEnd:
              type: string
              format: date-time
              description: Instant the counter renews (exclusive end, UTC)
              example: '2026-11-01T03:00:00Z'
    StudyStatus:
      type: string
      enum: [CREATED, STARTED, PAUSED, COMPLETED, ARCHIVED]
      description: >
        CREATED = cadastrado ainda não iniciado; STARTED = em andamento.
        Limite maxActiveStudies aplica-se a Studies STARTED.
    StudyRoutine:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          description: >
            Human-readable cadence label (e.g. "Mon, Wed · 1h 30min").
            Derived from daysOfWeek + session duration (`time`) when present.
            Duration 00:00 is omitted from the label.
        daysOfWeek:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
          description: Selected weekdays for the study routine
        time:
          type: object
          description: >
            Planned session duration (not clock time of day).
            hour 0–23, minute 0–59; 00:00 means no duration preset.
          required: [hour, minute]
          properties:
            hour:
              type: integer
              minimum: 0
              maximum: 23
            minute:
              type: integer
              minimum: 0
              maximum: 59
        pomodoro:
          type: object
          description: >
            Optional Pomodoro mode. Only meaningful when `time` is a positive duration.
            When enabled, finishing a study block auto-starts the rest timer.
          properties:
            enabled:
              type: boolean
            restMinutes:
              type: integer
              minimum: 1
              maximum: 60
              default: 5
              description: Rest duration in minutes after each study block.
        notes:
          type: string
    Study:
      type: object
      required: [id, title, objective, routine, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        objective:
          type: string
        routine:
          $ref: '#/components/schemas/StudyRoutine'
        status:
          $ref: '#/components/schemas/StudyStatus'
        createdAt:
          type: string
          format: date-time
        totalStudySeconds:
          type: integer
          minimum: 0
          description: >
            Accumulated seconds of study session time (excludes rest/break).
            Used for dedication metrics across the study lifecycle.
    CreateStudyRequest:
      type: object
      required: [title, objective, routine]
      properties:
        title:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
        routine:
          $ref: '#/components/schemas/StudyRoutine'
        status:
          $ref: '#/components/schemas/StudyStatus'
          default: CREATED
    UpdateStudyRequest:
      type: object
      description: Partial update — send only fields being edited
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
        routine:
          $ref: '#/components/schemas/StudyRoutine'
        status:
          $ref: '#/components/schemas/StudyStatus'
        totalStudySeconds:
          type: integer
          minimum: 0
          description: Accumulated study seconds (excludes rest)
    BillingMethod:
      type: string
      enum: [CARD, PIX]
    Subscription:
      type: object
      required: [plan, status, priceCents, currency, cancelAtPeriodEnd]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum: [NONE, PENDING, ACTIVE, CANCELED, EXPIRED]
          description: CANCELED keeps Premium until currentPeriodEnd; EXPIRED means the paid period ended
        method:
          $ref: '#/components/schemas/BillingMethod'
        priceCents:
          type: integer
          example: 5000
        currency:
          type: string
          example: BRL
        currentPeriodEnd:
          type: string
          format: date-time
          description: Premium is valid until this instant (next charge for an active card subscription)
        cancelAtPeriodEnd:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable business error code for i18n mapping
  responses:
    Problem:
      description: RFC 9457 problem details with Studia `code`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
