openapi: 3.1.0
info:
  title: Studia API
  version: 0.1.0
  description: >
    Contrato MVP para Mock Server e futuro Spring Boot.
    Access token via Authorization Bearer (memória no client).
    Refresh token via cookie HttpOnly (credentials include).
servers:
  - url: /api/v1
    description: Base path MVP
tags:
  - name: auth
  - name: studies
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: Refresh token HttpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and start a session (FEATURE-0004)
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and authenticated
          headers:
            Set-Cookie:
              description: Refresh token HttpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request a password reset link
      description: >
        Always answers 202, whether or not the email has an account (no account enumeration).
        The reset token is single-use and expires in 1 hour.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted
        '422':
          $ref: '#/components/responses/Problem'
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: A successful reset revokes every session and every pending reset token of the user.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh cookie and issue new access token
      operationId: refresh
      responses:
        '200':
          description: Session renewed
          headers:
            Set-Cookie:
              description: Rotated refresh token HttpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Problem'
  /auth/me:
    get:
      tags: [auth]
      summary: Current user, plan, entitlements and usage
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /studies:
    get:
      tags: [studies]
      summary: List studies for the current user
      operationId: listStudies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Study list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [studies]
      summary: Create a study (wizard submit)
      operationId: createStudy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyRequest'
      responses:
        '201':
          description: Study created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /studies/{studyId}:
    get:
      tags: [studies]
      summary: Get study by id
      operationId: getStudy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: Study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [studies]
      summary: Update study fields (localized edit)
      operationId: updateStudy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudyRequest'
      responses:
        '200':
          description: Study updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /studies/{studyId}/tasks:
    get:
      tags: [studies]
      summary: List tasks of a study, by position (FEATURE-0003)
      operationId: listTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [studies]
      summary: Add a task at the end of the list
      operationId: createTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /studies/{studyId}/tasks/{taskId}:
    patch:
      tags: [studies]
      summary: Rename, complete or move a task
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [studies]
      summary: Delete a task; the others are reindexed
      operationId: deleteTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/taskId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /studies/{studyId}/notes:
    get:
      tags: [studies]
      summary: List notes of a study, newest createdAt first (FEATURE-0003)
      operationId: listNotes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [studies]
      summary: Add a note
      operationId: createNote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteContentRequest'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /studies/{studyId}/notes/{noteId}:
    patch:
      tags: [studies]
      summary: Replace the content of a note
      operationId: updateNote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/noteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteContentRequest'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [studies]
      summary: Delete a note
      operationId: deleteNote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/noteId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    studyId:
      name: studyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    noteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        timeZone:
          type: string
          description: IANA time zone from the browser (ADR-0009). Invalid or missing → UTC.
          example: America/Sao_Paulo
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthSessionResponse:
      type: object
      required: [accessToken, user, plan, entitlements, usage]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
        plan:
          $ref: '#/components/schemas/Plan'
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        usage:
          $ref: '#/components/schemas/Usage'
    MeResponse:
      type: object
      required: [user, plan, entitlements, usage]
      properties:
        user:
          $ref: '#/components/schemas/User'
        plan:
          $ref: '#/components/schemas/Plan'
        entitlements:
          $ref: '#/components/schemas/Entitlements'
        usage:
          $ref: '#/components/schemas/Usage'
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timeZone:
          type: string
          description: IANA zone used for the quota period (ADR-0009)
          example: America/Sao_Paulo
    Plan:
      type: string
      enum: [FREE, PREMIUM]
      description: Informative for billing UI only — never authorize with plan checks
    Entitlements:
      type: object
      required: [capabilities, limits]
      properties:
        capabilities:
          type: array
          items:
            type: string
          example: [studies.create, statistics.advanced]
        limits:
          type: object
          additionalProperties:
            type: integer
          example:
            maxActiveStudies: 3
            maxStudyCreationsPerMonth: 10
    Usage:
      type: object
      required: [studyCreationsThisPeriod]
      properties:
        studyCreationsThisPeriod:
          type: object
          required: [used, limit, remaining, periodStart, periodEnd]
          description: >
            Free: calendar month in the user's time zone (ADR-0009).
            The client only displays the period; it never computes it.
          properties:
            used:
              type: integer
              minimum: 0
            limit:
              type: integer
              minimum: 0
            remaining:
              type: integer
              minimum: 0
            periodStart:
              type: string
              format: date-time
              description: Instant the current period started (UTC)
              example: '2026-10-01T03:00:00Z'
            periodEnd:
              type: string
              format: date-time
              description: Instant the counter renews (exclusive end, UTC)
              example: '2026-11-01T03:00:00Z'
    StudyStatus:
      type: string
      enum: [CREATED, STARTED, PAUSED, COMPLETED, ARCHIVED]
      description: >
        CREATED = cadastrado ainda não iniciado; STARTED = em andamento.
        Limite maxActiveStudies aplica-se a Studies STARTED.
    StudyRoutine:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          description: >
            Human-readable cadence label (e.g. "Mon, Wed · 1h 30min").
            Derived from daysOfWeek + session duration (`time`) when present.
            Duration 00:00 is omitted from the label.
        daysOfWeek:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
          description: Selected weekdays for the study routine
        time:
          type: object
          description: >
            Planned session duration (not clock time of day).
            hour 0–23, minute 0–59; 00:00 means no duration preset.
          required: [hour, minute]
          properties:
            hour:
              type: integer
              minimum: 0
              maximum: 23
            minute:
              type: integer
              minimum: 0
              maximum: 59
        pomodoro:
          type: object
          description: >
            Optional Pomodoro mode. Only meaningful when `time` is a positive duration.
            When enabled, finishing a study block auto-starts the rest timer.
          properties:
            enabled:
              type: boolean
            restMinutes:
              type: integer
              minimum: 1
              maximum: 60
              default: 5
              description: Rest duration in minutes after each study block.
        notes:
          type: string
    Study:
      type: object
      required: [id, title, objective, routine, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        objective:
          type: string
        routine:
          $ref: '#/components/schemas/StudyRoutine'
        status:
          $ref: '#/components/schemas/StudyStatus'
        createdAt:
          type: string
          format: date-time
        totalStudySeconds:
          type: integer
          minimum: 0
          description: >
            Accumulated seconds of study session time (excludes rest/break).
            Used for dedication metrics across the study lifecycle.
    CreateStudyRequest:
      type: object
      required: [title, objective, routine]
      properties:
        title:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
        routine:
          $ref: '#/components/schemas/StudyRoutine'
        status:
          $ref: '#/components/schemas/StudyStatus'
          default: CREATED
    UpdateStudyRequest:
      type: object
      description: Partial update — send only fields being edited
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
        routine:
          $ref: '#/components/schemas/StudyRoutine'
        status:
          $ref: '#/components/schemas/StudyStatus'
        totalStudySeconds:
          type: integer
          minimum: 0
          description: Accumulated study seconds (excludes rest)
    Task:
      type: object
      required: [id, studyId, title, done, position, createdAt]
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
        position:
          type: integer
          minimum: 0
          description: 0-based order inside the study; the server keeps it dense (0..n-1)
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: Set while done is true
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed by the server; whitespace-only is 422
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      description: >
        Partial update. `position` is the desired 0-based index; values past the end move the task to the end,
        and the server reindexes the other tasks. Archived studies answer 409 STUDY_READ_ONLY.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
        position:
          type: integer
          minimum: 0
    Note:
      type: object
      required: [id, studyId, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        studyId:
          type: string
          format: uuid
        content:
          type: string
          description: Markdown. Clients render it with raw HTML disabled and only http(s) links.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteContentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: Whitespace-only content is rejected with 422 VALIDATION_FAILED
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable business error code for i18n mapping
  responses:
    Problem:
      description: RFC 9457 problem details with Studia `code`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
